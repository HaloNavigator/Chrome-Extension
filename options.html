<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halo Navigator - Full Settings</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a2c33;
      --card-bg: rgba(255, 255, 255, 0.05);
      --input-bg: #0f1a1f;
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.5);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #00ff87;
      --red: #ef4444;
      --purple: #6366f1;
    }
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
      overflow-x: hidden;
      box-sizing: border-box;
    }
    * { box-sizing: border-box; }
    
    .container {
      width: 100%;
      max-width: 820px;
    }
    .header {
      margin-bottom: 32px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-img { width: 52px; height: 52px; margin-bottom: 12px; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
    .title { font-size: 18px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.2em; color: var(--text); }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-bottom: 120px;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
      height: fit-content;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .card-title {
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0.8;
      letter-spacing: 0.15em;
    }

    .form-section { display: flex; flex-direction: column; gap: 14px; }

    input, select {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      width: 100%;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 12px rgba(0,255,135,0.08); }

    .input-wrapper { display: flex; flex-direction: column; gap: 5px; }
    .input-label { font-size: 8px; font-weight: 900; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; padding-left: 2px; }

    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    .btn {
      padding: 12px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 900;
      text-transform: uppercase;
      width: 100%;
      transition: all 0.2s ease;
      letter-spacing: 0.1em;
      font-size: 11px;
    }
    .btn:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 6px 15px rgba(0,255,135,0.2); }
    .btn:active { transform: translateY(0); }

    .setting-row { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 10px; 
      background: rgba(0,0,0,0.2); 
      border-radius: 8px; 
      border: 1px solid var(--border);
    }
    .checkbox-group { display: flex; align-items: center; gap: 8px; }
    .checkbox-group input { width: auto; margin: 0; cursor: pointer; }
    .setting-label { font-size: 9px; font-weight: 900; text-transform: uppercase; color: var(--text-muted); cursor: pointer; }

    .list-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    .item {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
      min-width: 0;
      width: 100%;
    }
    .item:hover { background: rgba(255,255,255,0.04); border-color: var(--accent); }
    .color-dot { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; box-shadow: 0 0 8px rgba(0,0,0,0.5); }
    
    .item-info { flex: 1; min-width: 0; }
    
    .item-label { font-weight: 900; font-size: 13px; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
    .item-pattern { 
      font-size: 10px; 
      color: var(--text-muted); 
      font-family: monospace; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      white-space: nowrap; 
      display: block;
      width: 100%;
    }
    .tag { font-size: 7px; background: rgba(0,0,0,0.3); color: var(--accent); padding: 1px 4px; border-radius: 3px; font-weight: 900; text-transform: uppercase; }

    .item-actions { display: flex; gap: 2px; flex-shrink: 0; }
    .action-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 6px; border-radius: 8px; transition: all 0.2s; }
    .action-btn:hover { color: var(--accent); background: rgba(255,255,255,0.08); }
    .action-btn.delete:hover { color: var(--red); }

    .save-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 360px;
      z-index: 1000;
      padding: 0 16px;
    }

    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; gap: 24px; }
      .container { max-width: 460px; }
      body { padding: 32px 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="images/HN128.png" class="logo-img" alt="Logo">
      <div class="title">Halo Navigator Dashboard</div>
    </div>

    <div class="grid">
      <!-- Rules Section -->
      <section>
        <div class="card">
          <div class="card-title" id="rule-form-title">Environment Rules</div>
          <div class="form-section">
             <div class="input-row">
               <div class="input-wrapper">
                  <span class="input-label">Label</span>
                  <input type="text" id="rule-label" placeholder="e.g. Production">
               </div>
               <div class="input-wrapper">
                  <span class="input-label">URL Pattern</span>
                  <input type="text" id="rule-pattern" placeholder="e.g. /prod">
               </div>
             </div>
             
             <div class="input-row">
                <div class="input-wrapper">
                  <span class="input-label">Visual Style</span>
                  <select id="rule-style">
                    <option value="full">Full Background</option>
                    <option value="border">Colored Border</option>
                    <option value="top-bar">Accent Top Bar</option>
                    <option value="glow">Soft Glow</option>
                  </select>
                </div>
                <div class="input-wrapper">
                  <span class="input-label">Color</span>
                  <input type="color" id="rule-color" value="#00ff87" style="height: 38px; padding: 4px; cursor: pointer;">
                </div>
             </div>

             <div class="setting-row">
                <div style="font-size: 8px; font-weight: 900; text-transform: uppercase; color: var(--text-muted);">Intensity: <span id="strength-val" style="color: var(--accent); margin-left: 4px;">5</span></div>
                <input type="range" id="rule-strength" min="0" max="10" value="5" style="cursor: pointer; width: 100px; height: 4px; padding: 0;">
             </div>

             <div class="setting-row">
                <div class="checkbox-group">
                  <input type="checkbox" id="rule-hide-label">
                  <label for="rule-hide-label" class="setting-label">Hide Label</label>
                </div>
                <div style="display: flex; align-items: center; gap: 6px;">
                  <span class="setting-label">Pos:</span>
                  <select id="rule-label-position" style="width: 75px; padding: 5px; font-size: 10px; font-weight: 900; border-radius: 6px;">
                    <option value="left">Left</option>
                    <option value="center">Centre</option>
                    <option value="right" selected>Right</option>
                  </select>
                </div>
             </div>

             <button class="btn" id="rule-create">Create Rule</button>
             <div id="rule-edit-actions" style="display:none; gap: 10px;">
                <button class="btn" style="background: rgba(255,255,255,0.1); color: white;" id="rule-cancel">Cancel</button>
                <button class="btn" id="rule-update">Update</button>
             </div>
          </div>
          <div class="list-container" id="rules-list"></div>
        </div>
      </section>

      <!-- Shortcuts Section -->
      <section>
        <div class="card">
          <div class="card-title" id="cmd-form-title">Navigator Shortcuts</div>
          <div class="form-section">
            <div class="input-row" style="grid-template-columns: 75px 1fr;">
              <div class="input-wrapper">
                 <span class="input-label">Code</span>
                 <div style="position: relative;">
                    <span style="position: absolute; left: 10px; top: 10px; color: var(--accent); font-weight: 900; font-size: 14px;">#</span>
                    <input type="text" id="cmd-code" placeholder="KB" style="padding-left: 24px;">
                 </div>
              </div>
              <div class="input-wrapper">
                 <span class="input-label">Path or URL</span>
                 <input type="text" id="cmd-path" placeholder="e.g. /kb">
              </div>
            </div>
            <button class="btn" id="cmd-add" style="background: var(--accent); color: var(--bg);">Register Shortcut</button>
            <div id="cmd-edit-actions" style="display:none; gap: 10px;">
                <button class="btn" style="background: rgba(255,255,255,0.1); color: white;" id="cmd-cancel">Cancel</button>
                <button class="btn" id="cmd-update" style="background: var(--accent); color: var(--bg);">Update</button>
            </div>
          </div>
          <div class="list-container" id="commands-list"></div>
        </div>
      </section>
    </div>
  </div>

  <div class="save-bar">
    <button class="btn" id="global-save" style="font-size: 13px; height: 54px; box-shadow: 0 10px 30px rgba(0,255,135,0.25); border-radius: 27px;">Save & Apply All Settings</button>
  </div>

  <script src="options.js"></script>
</body>
</html>
