<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halo Navigator SQL Generator</title>
    <style>
        :root {
            --bg: rgba(15, 23, 42, 0.95);
            --panel-bg: #1a202c;
            --input-bg: #0a0c10;
            --text: #e2e8f0;
            --accent: #00ff87;
            --border: #2d3748;
            --btn-secondary: #2c3e50;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 1.5rem;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .header-title {
            color: var(--accent);
            font-weight: 900;
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            flex-shrink: 0;
            letter-spacing: 0.1em;
        }
        .container-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: 280px 1fr 320px 320px;
            max-width: 1700px;
            margin: 0 auto;
            flex: 1;
            min-height: 0;
            width: 100%;
        }
        .panel-sql {
            background-color: var(--panel-bg);
            padding: 1.25rem;
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .panel-header {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            flex-shrink: 0;
            letter-spacing: 0.1em;
            opacity: 0.8;
        }
        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
            min-height: 0;
        }
        /* Custom scrollbar styling */
        .scrollable-content::-webkit-scrollbar { width: 6px; }
        .scrollable-content::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 10px; }
        .scrollable-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; border: 1px solid rgba(0,0,0,0.2); }
        .scrollable-content::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .search-input {
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.75rem;
            width: 100%;
            margin-bottom: 0.75rem;
            flex-shrink: 0;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: var(--accent); }

        .table-item-sql {
            margin-bottom: 8px;
            border: 1px solid var(--border);
            padding: 10px;
            background: rgba(0,0,0,0.15);
            transition: border-color 0.2s;
            border-radius: 12px;
        }
        .table-item-sql:hover { border-color: var(--accent); }
        .table-header-row { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .table-name { font-size: 0.75rem; font-weight: 700; color: var(--text); }
        .select-all-btn { font-size: 0.6rem; font-weight: 800; color: var(--accent); cursor: pointer; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: rgba(0,255,135,0.05); }
        .select-all-btn:hover { background: rgba(0,255,135,0.15); }
        .field-list { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; padding-left: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
        .field-item { display: flex; align-items: center; gap: 8px; font-size: 0.7rem; color: var(--text); opacity: 0.6; cursor: pointer; }
        .field-item:hover { opacity: 1; }
        .field-item input { accent-color: var(--accent); width: 14px; height: 14px; }
        
        .sql-output-container { flex: 1; background-color: var(--input-bg); border-radius: 12px; border: 1px solid var(--border); margin-bottom: 0.75rem; overflow: hidden; display: flex; min-height: 80px; }
        .sql-output { flex: 1; width: 100%; background: transparent; color: var(--text); padding: 1rem; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; resize: none; outline: none; border: none; line-height: 1.5; }
        
        .btn-pill { padding: 10px 16px; border-radius: 9999px; font-weight: 800; font-size: 0.7rem; text-transform: uppercase; border: none; cursor: pointer; transition: all 0.2s; flex-shrink: 0; letter-spacing: 0.05em; }
        .btn-green { background-color: var(--accent); color: #1a2c33; }
        .btn-green:hover { transform: scale(1.02); filter: brightness(1.1); box-shadow: 0 4px 15px rgba(0,255,135,0.2); }
        .btn-dark { background-color: var(--btn-secondary); color: #fff; }
        
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .gap-4 { gap: 1rem; }
        .flex-1 { flex: 1; }
        .hidden { display: none !important; }
        
        .join-card { display:flex; gap:10px; margin-bottom:8px; background:rgba(0,0,0,0.2); padding:12px; border-radius:12px; border: 1px solid var(--border); transition: border-color 0.2s; }
        .join-card:hover { border-color: var(--accent); background: rgba(255,255,255,0.03); }
        .join-card input { accent-color: var(--accent); width: 18px; height: 18px; margin-top: 2px; cursor: pointer; }
        .join-label { font-size: 10px; font-weight: 900; color: var(--accent); margin-bottom: 2px; }
        .join-cond { font-size: 9px; font-family: monospace; color: var(--text); opacity: 0.5; word-break: break-all; }

        .label-sub { font-size: 9px; color: var(--text); opacity: 0.5; font-weight: 900; margin-bottom: 6px; text-transform: uppercase; flex-shrink: 0; letter-spacing: 0.1em; }
        #group-by-select { height: 100px; width: 100%; background: var(--input-bg); color: var(--text); border: 1px solid var(--border); font-size: 10px; flex-shrink: 0; border-radius: 8px; padding: 5px; outline: none; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="header-title">Halo Navigator SQL Generator</div>
    <div class="container-grid">
        <!-- Column 1: Tables -->
        <div class="panel-sql">
            <div class="panel-header">
                <span>Tables & Fields</span>
            </div>
            <input type="text" id="table-search" class="search-input" placeholder="Search tables...">
            <div id="schema-container-sql" class="scrollable-content"></div>
        </div>

        <!-- Column 2: Conditions & Aggregates -->
        <div class="flex flex-col gap-4 min-h-0">
            <div class="panel-sql" style="flex: 0 0 100px;">
                <div class="panel-header">Request Filter</div>
                <div id="request-type-container"></div>
            </div>
            <div class="panel-sql flex-1">
                <div class="panel-header">WHERE Conditions</div>
                <div id="where-conditions-container" class="scrollable-content"></div>
                <button id="add-where-btn" class="btn-pill btn-green" style="margin-top:8px;">Add Condition</button>
                <div style="height: 1px; background: var(--border); margin: 16px 0;"></div>
                <div class="panel-header">Aggregation</div>
                <span class="label-sub">Group By:</span>
                <select id="group-by-select" multiple></select>
            </div>
        </div>

        <!-- Column 3: Dedicated Joins Explorer -->
        <div class="panel-sql">
            <div class="panel-header">Joins Explorer</div>
            <input type="text" id="join-search" class="search-input" placeholder="Search joins...">
            <div id="join-list" class="scrollable-content"></div>
        </div>

        <!-- Column 4: Final Output -->
        <div class="panel-sql">
            <div class="panel-header">Final Query</div>
            <div class="sql-output-container">
                <textarea id="query-output-sql" class="sql-output" readonly placeholder="Generate SQL..."></textarea>
            </div>
            <div class="flex gap-2">
                <button id="copy-btn-sql" class="btn-pill btn-green flex-1">Copy SQL</button>
                <button id="clear-btn-sql" class="btn-pill btn-dark" style="padding: 0 12px;">✕</button>
            </div>
        </div>
    </div>
    <script src="sql-generator.js"></script>
</body>
</html>
